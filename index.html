<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>CLUB GENESIS POS</title>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#f5f7fb"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="GENESIS POS"/>
  <link rel="apple-touch-icon" href="icon-192.png"/>
  <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png"/>
  <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet"/>
  <script src="boot-compat.js?v=6.71"></script>
  <!-- Firebase SDKはfirebase-init.js内でタイムアウト付きロード -->
  <script src="firebase-init.js?v=6.71"></script>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
<div id="receipt-print-area"></div>

<!-- ===== パスワード画面 ===== -->
<div id="pw-screen" style="display:none;position:fixed;inset:0;background:#0a0a0f;z-index:9999;display:flex;align-items:center;justify-content:center;">
  <div style="text-align:center;width:320px;padding:0 20px;">
    <div style="font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:300;letter-spacing:.3em;color:#d4a017;margin-bottom:8px;">CLUB GENESIS</div>
    <div style="font-size:10px;color:#555;letter-spacing:.15em;margin-bottom:40px;">POS SYSTEM</div>
    <div style="margin-bottom:12px;">
      <input type="password" id="pw-input" class="ip" placeholder="パスワードを入力" autocomplete="current-password"
        style="font-size:16px;text-align:center;letter-spacing:.1em;padding:14px;"
        onkeydown="if(event.key==='Enter')checkPW()"
      />
    </div>
    <button class="btn gbg" onclick="checkPW()" style="width:100%;padding:14px;font-size:15px;font-weight:700;border-radius:8px;touch-action:manipulation;">入室する</button>
    <div id="pw-error" style="color:#ff6b6b;font-size:12px;margin-top:12px;min-height:18px;"></div>
  </div>
</div>
<div id="loading">
  <div style="font-family:'Cormorant Garamond',serif;font-size:28px;color:#d4a017;letter-spacing:.2em;">CLUB GENESIS</div>
  <div class="sp"></div>
  <div id="lmsg" style="font-size:12px;color:#666;letter-spacing:.1em;">Firebaseに接続中...</div>
  <div id="lsub" style="font-size:11px;color:#444;margin-top:4px;">しばらくお待ちください</div>
</div>
<div id="app" style="display:none;">
  <header>
    <div style="display:flex;align-items:baseline;gap:10px;">
      <span style="font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300;letter-spacing:.2em;color:#d4a017;cursor:pointer;touch-action:manipulation;" onclick="sv('home')" title="ホームへ戻る">CLUB GENESIS</span>
      <span style="font-size:10px;color:#666;letter-spacing:.1em;">POS SYSTEM</span><span style="font-size:9px;color:#555;letter-spacing:.05em;">Ver6.71</span><span style="font-size:9px;color:#444;letter-spacing:.05em;">Created by Uruu</span>
    </div>
    <nav style="display:flex;gap:2px;" id="main-nav">
      <button class="nb" id="nf" onclick="sv('floor')">フロア</button>
      <button class="nb" id="nli" onclick="sv('list')">リスト</button>
      <button class="nb" id="nsh" onclick="sv('shifts')">出勤</button>
      <button class="nb" id="nh" onclick="sv('history')">データ</button>
      <button class="nb" id="ncl" onclick="sv('closing')">締め</button>
      <button class="nb" id="nan" onclick="sv('analysis')">分析</button>
      <button class="nb" id="ns" onclick="sv('settings')">設定</button>
      <button class="nb" id="nm" onclick="sv('admin')">管理</button>
    </nav>
    <div style="display:flex;align-items:center;gap:8px;">
      <button class="btn" id="ops-btn" onclick="om('opsMenu')" style="display:none;padding:4px 10px;background:rgba(212,160,23,.12);border:1px solid rgba(212,160,23,.3);color:#d4a017;border-radius:4px;font-size:11px;font-weight:700;touch-action:manipulation;">営業</button>
      <button class="btn" id="mgmt-btn" onclick="om('mgmtMenu')" style="padding:4px 10px;background:rgba(255,80,80,.12);border:1px solid rgba(255,80,80,.3);color:#ff6b6b;border-radius:4px;font-size:11px;font-weight:700;touch-action:manipulation;">管理</button>
      <div id="sb" style="font-size:10px;color:#4ade80;letter-spacing:.05em;background:rgba(74,222,128,.06);border:1px solid rgba(74,222,128,.2);border-radius:4px;padding:2px 8px;">⟳ 同期済み ✓</div>
      <div id="clk" style="font-size:13px;color:#888;"></div>
    </div>
  </header>
  <!-- バージョン不一致オーバーレイ（古いバージョンの端末に再読み込みを要求） -->
  <div id="version-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.97);z-index:999999;flex-direction:column;align-items:center;justify-content:center;gap:20px;touch-action:none;">
    <div style="font-size:22px;font-weight:900;color:#d4a017;letter-spacing:.08em;">アップデートがあります</div>
    <div style="font-size:14px;color:#aaa;text-align:center;line-height:1.9;">新しいバージョンが配信されました<br>再読み込みしてください</div>
    <button onclick="location.reload(true)" style="padding:16px 40px;background:linear-gradient(135deg,#b8960c,#e8c84a);color:#1a1200;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;letter-spacing:.05em;">再読み込み</button>
  </div>
  <!-- オフライン操作ブロックオーバーレイ（初回sync後のみ表示） -->
  <div id="offline-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:99999;flex-direction:column;align-items:center;justify-content:center;gap:20px;touch-action:none;">
    <div style="font-size:28px;font-weight:900;color:#ff4444;letter-spacing:.08em;">OFFLINE</div>
    <div style="font-size:14px;color:#aaa;text-align:center;line-height:1.9;">WiFi接続を確認してください<br>接続が回復すると自動的に再開されます</div>
  </div>
  <main id="m"></main>
</div>
<div id="md"></div>
<div id="floor-order-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99;align-items:center;justify-content:center;padding:8px;">
  <div id="fom-inner" style="background:#141418;border:1px solid rgba(184,150,12,.3);border-radius:10px;padding:18px;width:100%;max-width:min(1400px,98vw);max-height:96vh;display:flex;flex-direction:column;overflow:hidden;"></div>
</div>
<script src="printer-loader.js?v=6.71"></script>
<script src="app.js?v=6.71"></script>
<script src="closing.js?v=6.71"></script>
</body>
</html>
